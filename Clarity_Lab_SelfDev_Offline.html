function sanitize(raw){
  if(!raw||typeof raw!=='object'||Array.isArray(raw)||![1,2].includes(raw.schema))throw Error('Unsupported or invalid backup format.');
  const out=defaultData();
  if(raw.answers&&typeof raw.answers==='object'&&!Array.isArray(raw.answers))for(const [k,v] of Object.entries(raw.answers))if(allowedQuestions.has(k)&&Number.isInteger(v)&&v>=1&&v<=5)out.answers[k]=v;
  if(Array.isArray(raw.completed))out.completed=[...new Set(raw.completed.filter(x=>typeof x==='string'&&allowedLessons.has(x)))].slice(0,LESSONS.length);
  if(Array.isArray(raw.practiced))out.practiced=[...new Set(raw.practiced.filter(x=>typeof x==='string'&&allowedExercises.has(x)))].slice(0,EXERCISES.length);
  const seen=new Set();
  if(Array.isArray(raw.journal))out.journal=raw.journal.filter(x=>{
    if(!x||typeof x!=='object'||typeof x.id!=='string'||x.id.length>80||seen.has(x.id)||typeof x.text!=='string'||typeof x.created!=='string'||!Number.isFinite(Date.parse(x.created)))return false;
    seen.add(x.id);return true;
  }).slice(0,100).map(x=>({id:x.id,text:cleanText(x.text,600),created:new Date(x.created).toISOString()}));
  out.theme=raw.theme==='light'?'light':'dark';out.largeText=raw.largeText===true;
  return out;
}
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(raw){if(raw.length>1024*1024)throw Error('Stored record exceeds size limit.');data=sanitize(JSON.parse(raw));}else{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));}available=true;}catch(err){available=false;saveLabel='Memory only — export before closing';notice='This browser could not open local storage. Your changes may disappear when you close the page.';noticeError=true;}document.documentElement.dataset.theme=data.theme;document.documentElement.classList.toggle('large-text',data.largeText);}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(data));available=true;saveLabel='Saved on this device';}catch(_){available=false;saveLabel='Memory only — export before closing';setNotice('Local storage is unavailable or full. Export your records to avoid losing changes.',true);}updateSaveChip();}
function updateSaveChip(){const chip=$('#save-chip');if(chip){chip.textContent=saveLabel;chip.classList.toggle('warning',!available);}}
function setNotice(text,error=false){notice=text;noticeError=error;const target=$('#notice');if(target){target.className='notice'+(error?' error':'');target.innerHTML=`<span>${esc(text)}</span><button type="button" data-action="dismiss" aria-label="Dismiss notification">✕</button>`;target.hidden=false;}}
function toast(text){const t=$('#toast');if(!t)return;t.textContent=text;t.classList.add('show');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove('show'),3600);}
function countAnswers(){return Object.keys(data.answers).length;}

function analyze(text,exercise){const trimmed=String(text||'').trim();const words=trimmed.match(/[\p{L}\p{N}][\p{L}\p{N}'’-]*/gu)||[];if(!trimmed)return{words:0,strengths:[],suggestions:['Add a short answer first.'],explanation:'Prompts only; this is not speech recognition or an AI evaluation.'};const strengths=[],suggestions=[];if(words.length>=18)strengths.push('There is enough text to develop an idea.');else suggestions.push('Consider adding one reason or concrete example.');if(/\b(for example|for instance|such as|e\.g\.|contoh|misalnya)\b/i.test(trimmed))strengths.push('You signaled an example.');else if(['clarity','story','delivery'].includes(exercise.skill))suggestions.push('Would a specific example help your listener?');if(/[?？]/.test(trimmed)&&['listening','empathy'].includes(exercise.skill))strengths.push('You included a question that may invite a reply.');else if(['listening','empathy'].includes(exercise.skill))suggestions.push('Try an open question that gives the other person a choice.');if(/\b(because|therefore|since|so that|kerana)\b/i.test(trimmed))strengths.push('You used a phrase to connect your reasoning.');else if(['clarity','confidence'].includes(exercise.skill))suggestions.push('You could connect the point and reason with “because.”');if(words.length>95)suggestions.push('For a short exercise, consider which details are essential.');if(!suggestions.length)suggestions.push('Read once more for a clear ending and a respectful tone.');return{words:words.length,strengths,suggestions,explanation:'Transparent keyword-and-length prompts only. This cannot measure real comprehension, confidence, kindness, pronunciation, or voice quality.'};}

<div class="card"><div class="result-row">${skillPill(exercise.skill)}<span class="mini-kpi">${esc(exercise.duration)}</span></div><h2 style="margin:15px 0 12px">${esc(exercise.title)}</h2><p>${esc(exercise.prompt)}</p><div class="callout">✧ <strong>Helpful idea:</strong> ${esc(exercise.hint)}</div><div style="margin-top:22px"><label class="form-label" for="practice-answer">Your practice response</label><textarea id="practice-answer" maxlength="2000" placeholder="Write a response in your own words…">${esc(ui.draft)}</textarea></div><div class="form-actions"><button class="button" data-action="feedback">Reflect on my answer ↗</button><button class="button ghost" data-action="practice-done">${finished?'✓ Practiced (undo)':'✓ Mark practiced'}</button><button class="button ghost" data-action="reset-practice">Clear text</button></div><div class="mini-kpi" id="practice-count">${ui.draft.length}/2000 characters · Never sent online</div>
 ${ui.feedback?`<div class="feedback" role="status" aria-live="polite"><h3>Reflection prompts</h3><p class="mini-kpi">About ${ui.feedback.words} words</p>${ui.feedback.strengths.length?`<strong>Things you can build on</strong><ul>${ui.feedback.strengths.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}<strong>Things to consider</strong><ul>${ui.feedback.suggestions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><p class="mini-kpi">${esc(ui.feedback.explanation)}</p></div>`:''}
 <hr class="divider"><div class="result-row"><div><strong>Read this prompt aloud</strong><p style="font-size:.8rem;margin:3px 0">Uses your device's speech synthesis when supported.</p></div><button class="button ghost minor" data-action="speak">▶ Listen</button></div><div class="result-row"><div><strong>Silent practice timer</strong><p style="font-size:.8rem;margin:3px 0">No microphone access or recordings.</p></div><strong class="mono" id="timer-count">${String(Math.floor(ui.timerSeconds/60)).padStart(2,'0')}:${String(ui.timerSeconds%60).padStart(2,'0')}</strong></div><div class="form-actions"><button class="button ghost minor" data-action="timer">${ui.timerId?'Pause timer':'Start timer'}</button><button class="button ghost minor" data-action="timer-reset">Reset</button></div>
 </div></div>`;}
function quiz(){const answered=countAnswers();if(ui.quizIndex>=QUESTIONS.length){const scores=scoreList();return `${sectionTitle('SELF-REFLECTION','Your learning snapshot','These are personal self-ratings, not a diagnosis or comparison with others.')}
<div class="card assessment-card"><h2>Reflection overview</h2><p>Use these ratings to choose what you want to practice next. You can change any answer at any time.</p><div class="stack">${scores.map(s=>`<div class="result-row"><div><h3>${esc(s.name)}</h3><span class="mini-kpi">${s.answered}/${s.total} statements answered</span></div><span class="result-score">${s.average==null?'—':s.average.toFixed(1)+' / 5'}</span></div>`).join('')}</div><hr class="divider"><div class="form-actions"><button class="button" data-action="quiz-back">← Review answers</button><button class="button ghost" data-action="nav" data-page="learn">Explore lessons</button></div><div class="callout">A lower or higher rating is neither a label nor a target. It simply helps you reflect on your own experience.</div></div>`;}
const q=QUESTIONS[ui.quizIndex];const chosen=data.answers[q.id];return `${sectionTitle('26 ORIGINAL PROMPTS','Understand your starting point','Answer at your own pace. You may skip a question and return to it later.')}
<div class="card assessment-card"><div class="question-head"><span>Question <strong>${ui.quizIndex+1}</strong> of ${QUESTIONS.length}</span><span>${answered} answered</span></div><div class="progress" role="progressbar" aria-valuenow="${ui.quizIndex+1}" aria-valuemin="0" aria-valuemax="26" aria-label="Assessment question position"><span style="width:${pct(ui.quizIndex+1,QUESTIONS.length)}%"></span></div><div style="margin-top:24px">${skillPill(q.skill)}</div><h2 class="quiz-question" id="question-text">${esc(q.text)}</h2><fieldset class="rating" aria-labelledby="question-text"><legend class="sr-only">Choose how often this statement feels true for you</legend>${['Rarely','Sometimes','Occasionally','Often','Usually'].map((x,i)=>`<label class="rate"><input type="radio" name="current-answer" value="${i+1}" ${chosen===i+1?'checked':''} aria-label="${i+1}: ${x}"><span><strong>${i+1}</strong><small>${x}</small></span></label>`).join('')}</fieldset><p class="mini-kpi" style="margin-top:17px">There are no right answers. You are free to change your selection.</p><div class="quiz-footer"><button class="button ghost" data-action="quiz-prev" ${ui.quizIndex===0?'disabled':''}>← Previous</button><button class="button ghost" data-action="quiz-skip">Skip</button><button class="button" data-action="quiz-next">${ui.quizIndex===QUESTIONS.length-1?'See overview ↗':'Next →'}</button></div><div style="margin-top:24px"><button class="text-btn" data-action="quiz-results">View current results (${answered}/${QUESTIONS.length})</button></div></div>`;}
function journal(){return `${sectionTitle('PRIVATE REFLECTIONS','A space for your thoughts','A quick note can help you notice what worked. Entries stay on this device unless you export them.')}
<div class="inline-grid"><div class="card"><div class="note-kicker">ADD A NOTE</div><h2 style="font-size:1.3rem;margin:10px 0">What did you try today?</h2><label for="journal-text" class="form-label">Your note</label><textarea id="journal-text" maxlength="600" placeholder="I tried asking a follow-up question, and noticed…">${esc(ui.entry)}</textarea><div class="form-actions"><button class="button" data-action="journal-save" ${data.journal.length>=100?'disabled':''}>Save privately ↗</button><span class="character-count" id="journal-count">${ui.entry.length}/600</span></div><div class="callout">Only you can decide what feels useful to record. Avoid including information that would compromise someone else's privacy.</div></div><div class="card"><div class="note-kicker">REFLECTION HISTORY</div><h2 style="font-size:1.3rem;margin:10px 0">${data.journal.length} saved note${data.journal.length===1?'':'s'}</h2>${data.journal.length?`<div class="journal-list">${data.journal.map(x=>`<article class="journal-item"><div class="top"><time datetime="${esc(x.created)}">${esc(new Date(x.created).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}))}</time><button class="text-btn" data-action="journal-delete" data-id="${esc(x.id)}" aria-label="Delete journal entry">Delete</button></div><p>${esc(x.text)}</p></article>`).join('')}</div>`:'<div class="empty">No notes yet. Your reflections will appear here.</div>'}</div></div>`;}
function settings(){return `${sectionTitle('LOCAL-FIRST DESIGN','Privacy & preferences','You own your learning records. No account, tracking, advertising, or remote AI calls.')}
<div class="grid settings-grid"><div class="card"><div class="note-kicker">YOUR DATA</div><h2 style="font-size:1.35rem;margin:12px 0">Keep control of your records</h2><p>Backup files contain your self-assessment ratings, completed lessons and private journal notes. Backups are unencrypted, so store them somewhere private.</p><div class="stack"><button class="button ghost" data-action="export">↓ Export private JSON backup</button><button class="button ghost" data-action="import">↑ Import a backup</button><input id="backup-input" class="sr-only" type="file" accept=".json,application/json" aria-label="Choose a Clarity Lab JSON backup"><button class="button danger" data-action="erase">Erase all learning data</button></div><div class="callout" style="margin-top:20px">${available?'✓ Device storage is working.':'⚠ Device storage unavailable. Use export to preserve this session.'}</div></div>
<div class="card"><div class="note-kicker">PERSONALIZE</div><h2 style="font-size:1.35rem;margin:12px 0">Make it yours</h2><div class="settings-item"><div><strong>Light appearance</strong><p style="margin:4px 0;font-size:.82rem">Switch between dark and light themes.</p></div><button class="switch" data-action="theme" role="switch" aria-checked="${data.theme==='light'}" aria-label="Light appearance"></button></div><div class="settings-item"><div><strong>Larger text</strong><p style="margin:4px 0;font-size:.82rem">Increase overall reading size.</p></div><button class="switch" data-action="large-text" role="switch" aria-checked="${data.largeText}" aria-label="Larger text"></button></div><hr class="divider"><p class="mini-kpi">Your operating system may offer additional accessibility and text-to-speech options.</p></div></div>
<div class="section-heading"><h2>Privacy explained</h2></div><div class="card"><ul class="audit-list"><li><span>✓</span> The web app is one HTML file with all styles, lessons and code embedded.</li><li><span>✓</span> No network requests, cloud sync, analytics, advertising, or third-party scripts.</li><li><span>✓</span> No camera, microphone, contacts, or location permission requested by the Android wrapper.</li><li><span>✓</span> Journal notes and answers use device-local browser storage only, when available.</li><li><span>✓</span> Reflection prompts use transparent text heuristics, not a hidden AI model.</li><li><span>!</span> A browser can delete local data, including when storage is cleared. Make a backup if your records matter.</li></ul></div>`;}
function about(){return `${sectionTitle('PROJECT TRANSPARENCY','How Clarity Lab works','An independent educational prototype, not an official RiseGuide application or a copy of its paid lessons.')}
<div class="grid settings-grid"><div class="card"><div class="note-kicker">WHAT IS INCLUDED</div><h2 style="font-size:1.3rem;margin:11px 0">Everything in one file</h2><ul class="bullets"><li>Six practical communication domains.</li><li>18 original guided lessons.</li><li>12 reflective scenarios and a nonjudgmental text coach.</li><li>26 self-rating statements and a per-skill reflection view.</li><li>Private journaling, backup/restore and theme controls.</li><li>Accessibility-conscious mobile layout and keyboard navigation.</li></ul></div><div class="card"><div class="note-kicker">WHAT IT DOES NOT CLAIM</div><h2 style="font-size:1.3rem;margin:11px 0">Transparent limitations</h2><ul class="bullets"><li>It does not measure charisma, personality, speech accuracy, or learning outcomes.</li><li>It does not analyze voice recordings or provide clinical advice.</li><li>The score is a self-rating summary, not a comparison with other people.</li><li>Offline storage support depends on browser settings.</li><li>Text-to-speech availability varies by device.</li><li>Android APK compilation and device behavior require separate verification.</li></ul></div></div><div class="section-heading"><h2>How to practice thoughtfully</h2></div><div class="card"><p>Choose a small skill, read a short lesson, try one scenario and note anything you learned. You can repeat exercises, skip questions or delete your records without losing access to the content.</p><div class="form-actions"><button class="button" data-action="nav" data-page="learn">Explore lessons</button><button class="button ghost" data-action="nav" data-page="settings">Privacy settings</button></div></div>`;}
function render(){const active= NAV.find(n=>n[0]===ui.page)||NAV[0];const bodies={home:overview,learn:lessons,practice,quiz,journal,settings,about};document.documentElement.dataset.theme=data.theme;document.documentElement.classList.toggle('large-text',data.largeText);
 $('#app').innerHTML=`<a href="#main" class="skip">Skip to content</a><div class="app"><aside class="sidebar"><a href="#main" class="brand" data-action="nav" data-page="home"><span class="brand-mark">✦</span><span><strong>clarity<span style="color:var(--accent)">lab</span></strong><small>SELF-DEVELOPMENT STUDIO</small></span></a><div><div class="rail-label">DISCOVER</div><nav class="rail" aria-label="Main navigation">${NAV.map(([key,name,icon])=>`<button class="rail-btn ${ui.page===key?'active':''}" data-action="nav" data-page="${key}" ${ui.page===key?'aria-current="page"':''}><span aria-hidden="true">${icon}</span><span>${esc(name)}</span></button>`).join('')}</nav></div><div class="sidebar-spacer"></div><div class="side-tip"><div class="spark">✧</div><strong>Progress is personal.</strong><p>One thoughtful conversation can teach more than a perfect performance.</p></div><div class="side-footer">© 2026 CLARITY LAB · PRIVATE & FREE</div></aside><div class="stage"><header class="topbar"><div class="crumb"><span>SELF-DEVELOPMENT STUDIO</span><strong>${esc(active[1])}</strong></div><div class="top-actions"><span class="pill"><span class="pill-dot"></span> No online account</span><span class="pill ${available?'':'warning'}" id="save-chip">${esc(saveLabel)}</span><button class="icon-btn" data-action="theme" aria-label="Toggle light and dark theme" title="Toggle theme">${data.theme==='light'?'☾':'☼'}</button></div></header><main id="main" class="content" tabindex="-1"><div id="notice" class="notice ${noticeError?'error':''}" ${notice?'':'hidden'}><span>${esc(notice)}</span><button data-action="dismiss" aria-label="Dismiss notification">✕</button></div>${bodies[ui.page]()}<div class="footer"><span>✦ Original, free learning content · No registration</span><span>Local-only by design · v2.0</span></div></main></div></div><nav class="bottom-nav" aria-label="Mobile navigation">${NAV.slice(0,5).map(([key,name,icon])=>`<button data-action="nav" data-page="${key}" class="${ui.page===key?'active':''}" aria-label="${esc(name)}" ${ui.page===key?'aria-current="page"':''}><span aria-hidden="true">${icon}</span><small>${esc(name)}</small></button>`).join('')}<button data-action="nav" data-page="settings" class="${['settings','about'].includes(ui.page)?'active':''}" aria-label="Settings and more"><span aria-hidden="true">⚙</span><small>More</small></button></nav><div class="toast" id="toast" role="status" aria-live="polite"></div>`;
 if(ui.page==='practice'&&ui.timerId)syncTimer();
}
function go(page){if(!NAV.some(n=>n[0]===page))return;stopTimer();ui.page=page;ui.lesson=null;ui.feedback=null;render();window.scrollTo({top:0,behavior:'instant'});$('#main')?.focus({preventScroll:true});}
function stopTimer(){if(ui.timerId){clearInterval(ui.timerId);ui.timerId=null;}}
function syncTimer(){const t=$('#timer-count');if(!t)return;t.textContent=String(Math.floor(ui.timerSeconds/60)).padStart(2,'0')+':'+String(ui.timerSeconds%60).padStart(2,'0');}
function importRaw(text){if(text.length>1024*1024)throw Error('Backup exceeds the 1 MB import limit.');const incoming=sanitize(JSON.parse(text));if(!confirm('Replace all current learning records with this backup?'))return;data=incoming;ui.entry='';ui.draft='';ui.feedback=null;save();render();toast('Backup imported and validated.');}
function exportData(){const text=JSON.stringify({...data,exportedAt:stamp()},null,2);if(window.AndroidBridge&&typeof window.AndroidBridge.exportJson==='function'){window.AndroidBridge.exportJson(text);toast('Choose where to save your private backup.');return;}const blob=new Blob([text],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='clarity-lab-backup.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);toast('Private JSON backup prepared.');}
window.__clarityImportBase64=function(encoded){try{if(typeof encoded!=='string'||encoded.length>1400000)throw Error('Backup is too large.');const decoded=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));const txt=new TextDecoder('utf-8',{fatal:true}).decode(decoded);importRaw(txt);}catch(err){setNotice('Could not import backup: '+err.message,true);}};
window.__clarityBridgeMessage=function(message){toast(String(message||'Android file action finished.').slice(0,200));};
function click(event){const target=event.target.closest('[data-action]');if(!target)return;if(target.tagName==='A')event.preventDefault();const a=target.dataset.action,id=target.dataset.id;
 switch(a){case 'nav':go(target.dataset.page);break;
 case 'lesson':if(allowedLessons.has(id)){ui.page='learn';ui.lesson=id;render();window.scrollTo(0,0);}break;
 case 'back-lessons':ui.lesson=null;render();break;
 case 'toggle-lesson':if(allowedLessons.has(id)){data.completed=data.completed.includes(id)?data.completed.filter(x=>x!==id):[...data.completed,id];save();render();toast('Lesson progress updated.');}break;
 case 'exercise':if(allowedExercises.has(id)){stopTimer();ui.exercise=id;ui.draft='';ui.feedback=null;ui.timerSeconds=0;render();}break;
 case 'feedback':{const ex=EXERCISES.find(x=>x.id===ui.exercise);ui.draft=($('#practice-answer')?.value||'').slice(0,2000);ui.feedback=analyze(ui.draft,ex);render();break;}
 case 'practice-done':data.practiced=data.practiced.includes(ui.exercise)?data.practiced.filter(x=>x!==ui.exercise):[...data.practiced,ui.exercise];save();render();toast('Practice log updated.');break;
 case 'reset-practice':ui.draft='';ui.feedback=null;render();break;
 case 'quiz-prev':ui.quizIndex=Math.max(0,ui.quizIndex-1);render();break;
 case 'quiz-next':ui.quizIndex=Math.min(QUESTIONS.length,ui.quizIndex+1);render();break;
 case 'quiz-skip':{const q=QUESTIONS[ui.quizIndex];if(q&&Object.prototype.hasOwnProperty.call(data.answers,q.id)){delete data.answers[q.id];save();}ui.quizIndex=Math.min(QUESTIONS.length,ui.quizIndex+1);render();break;}
 case 'quiz-back':ui.quizIndex=0;render();break;
 case 'quiz-results':ui.quizIndex=QUESTIONS.length;render();break;
 case 'journal-save':{const t=($('#journal-text')?.value||'').trim().slice(0,600);if(!t){toast('Write a short reflection before saving.');break;}if(data.journal.length>=100){toast('The journal has reached its 100-note limit.');break;}const id=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,11);data.journal=[{id,created:stamp(),text:t},...data.journal];ui.entry='';save();render();toast('Reflection saved locally.');break;}
 case 'journal-delete':if(confirm('Delete this journal note permanently?')){data.journal=data.journal.filter(x=>x.id!==id);save();render();}break;
 case 'theme':data.theme=data.theme==='dark'?'light':'dark';save();render();break;
 case 'large-text':data.largeText=!data.largeText;save();render();break;
 case 'export':exportData();break;
 case 'import':if(window.AndroidBridge&&typeof window.AndroidBridge.importJson==='function'){window.AndroidBridge.importJson();}else $('#backup-input')?.click();break;
 case 'erase':if(confirm('Erase every lesson completion, assessment answer, and journal entry stored by Clarity Lab on this device? This cannot be undone.')){const theme=data.theme,largeText=data.largeText;data=defaultData();data.theme=theme;data.largeText=largeText;ui.entry='';ui.draft='';ui.quizIndex=0;save();render();toast('All learning records cleared.');}break;
 case 'dismiss':notice='';noticeError=false;const banner=$('#notice');if(banner)banner.hidden=true;break;
 case 'speak':{if(!('speechSynthesis' in window)){toast('Text-to-speech is not supported on this device.');break;}const ex=EXERCISES.find(x=>x.id===ui.exercise);try{window.speechSynthesis.cancel();const speech=new SpeechSynthesisUtterance(ex.prompt);speech.rate=.9;window.speechSynthesis.speak(speech);}catch(_){toast('Text-to-speech is unavailable.');}break;}
 case 'timer':if(ui.timerId){stopTimer();render();}else{ui.timerId=setInterval(()=>{ui.timerSeconds=Math.min(5999,ui.timerSeconds+1);syncTimer();if(ui.timerSeconds>=5999){stopTimer();render();}},1000);render();}break;
 case 'timer-reset':stopTimer();ui.timerSeconds=0;render();break;
 }
}
function handleInput(event){const t=event.target;if(t.id==='practice-answer'){ui.draft=t.value.slice(0,2000);const el=$('#practice-count');if(el)el.textContent=ui.draft.length+'/2000 characters · Never sent online';}else if(t.id==='journal-text'){ui.entry=t.value.slice(0,600);const el=$('#journal-count');if(el)el.textContent=ui.entry.length+'/600';}else if(t.id==='lesson-search'){ui.query=t.value.slice(0,80);const selStart=t.selectionStart;render();const input=$('#lesson-search');input?.focus();try{input?.setSelectionRange(selStart,selStart);}catch(_){}}}
function handleChange(event){const t=event.target;if(t.id==='lesson-filter'){ui.filter=SKILLS.some(s=>s.id===t.value)?t.value:'all';render();}else if(t.name==='current-answer'){const q=QUESTIONS[ui.quizIndex];const rating=Number(t.value);if(q&&Number.isInteger(rating)&&rating>=1&&rating<=5){data.answers[q.id]=rating;save();}}else if(t.id==='backup-input'){const f=t.files?.[0];t.value='';if(!f)return;if(f.size>1024*1024){setNotice('Backup exceeds the 1 MB import limit.',true);return;}f.text().then(importRaw).catch(err=>setNotice('Could not import backup: '+err.message,true));}}
function init(){load();render();document.addEventListener('click',click);document.addEventListener('input',handleInput);document.addEventListener('change',handleChange);}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
})();

</script>
</body>
</html>
